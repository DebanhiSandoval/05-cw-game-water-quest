<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="img/cw_logo_horizontal.png" alt="Charity: Water Logo" class="charity-logo">
    </div>
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect 20 items to complete the game!</p>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div id="achievements" class="achievement"></div>
    <div class="game-grid"></div>
    <div class="difficulty-section">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <button id="start-game">Start Game</button>
    <button id="restart-game" style="display:none;">Restart Game</button>
  </div>
  <script src="script.js"></script>
</body>
<footer class ="site-footer">
  <a href="https://www.charitywater.org/the-spring/direct-wfw-dream-big?utm_source=bing&utm_medium=paid-ppc&utm_campaign=donor-acq-usrow&utm_term=cBC_CW_M_PAID_PMAX_ALL_US+ROW_EVERGREEN_DREAMBIG&utm_content=performance_max&msclkid=0ae8cad6eb051877a286a2245774467b">Donate to Charity: Water</a>
</footer>
</html>
